# Training Notes
# smaller version using 512d tokens / 8 + 4 layers like from paper
# about 71.7M params
# --> train at 128x128 resolution
# new custom generated dataset

model:
  latent_dim: 512 # reduced
  num_layers: 8 # reduced
  num_heads: 4 # reduced
  dim_feedforward: 2048 # reduced
  num_register_tokens: 16
  dropout: 0.0
  activation: swiglu
  norm_type: rms_norm
  norm_first: True
  view_indep_qk_norm: True
  qk_norm: True
  bias: False
  pe_type: rope
  rope_type: triangle
  rope_double_max_freq: False
  vertex_pe_num_freqs: 12
  use_vn_encoder: True
  vn_pe_num_freqs: 6
  vn_encoder_norm_type: rms_norm
  texture_encode_patch_size: 32
  texture_channels: 13
  texture_encoder_norm_type: rms_norm
  view_transformer_latent_dim: 512 # reduced
  view_transformer_ffn_hidden_dim: 2048 # reduced
  view_transformer_n_heads: 4 # reduced
  view_transformer_n_layers: 4 # reduced
  view_transformer_include_self_attn: True
  view_transformer_use_swin_attn: False
  vdir_pe_type: nerf
  vdir_num_freqs: 0
  patch_size: 8
  include_alpha: False
  use_dpt_decoder: True
  dpt_features: 128
  dpt_out_channels: [96, 192, 384, 768] # keep as before...?
  turn_to_cam_coord: True
  use_ldr: False

training:
  data_dir: "tmp/dataset_single_obj"
  log_dir: "training/logs/dataset_single_obj"
  max_dataset_size: 1
  resolution: 128
  batch_size: 1
  val_batch_size: 1      # batch size for validation dataloader
  epochs: 2000
  warmup_epochs: 200
  lr: 1e-4
  device: "cuda"
  use_amp: False  # disabled: bfloat16 crushes small grads in log-HDR space and destabilizes LPIPS
  log_viz_interval: 100  # epochs between validation runs and image logging
  checkpoint_interval: 500