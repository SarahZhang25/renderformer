# Training Notes
# smaller version using 512d tokens / 8 + 4 layers like from paper
# about 71.8M params
# --> train at 128x128 resolution
# new custom generated dataset
# test run with refactored training run

# Total parameters:        71,771,535
# Trainable parameters:    71,771,523
# Transformer params:      33,570,822
# View Transformer params: 31,314,313
#         Out DPT params:          10,226,563

model:
  latent_dim: 512 # reduced
  num_layers: 8 # reduced
  num_heads: 4 # reduced
  dim_feedforward: 2048 # reduced
  num_register_tokens: 16
  dropout: 0.0
  activation: swiglu
  norm_type: rms_norm
  norm_first: True
  view_indep_qk_norm: True
  qk_norm: True
  bias: False
  pe_type: rope
  rope_type: triangle
  rope_double_max_freq: False
  vertex_pe_num_freqs: 12
  use_vn_encoder: True
  vn_pe_num_freqs: 6
  vn_encoder_norm_type: rms_norm
  texture_encode_patch_size: 32
  texture_channels: 13
  texture_encoder_norm_type: rms_norm
  view_transformer_latent_dim: 512 # reduced
  view_transformer_ffn_hidden_dim: 2048 # reduced
  view_transformer_n_heads: 4 # reduced
  view_transformer_n_layers: 4 # reduced
  view_transformer_include_self_attn: True
  view_transformer_use_swin_attn: False
  vdir_pe_type: nerf
  vdir_num_freqs: 0
  patch_size: 8
  include_alpha: False
  use_dpt_decoder: True
  dpt_features: 128
  dpt_out_channels: [96, 192, 384, 768] # keep as before...?
  turn_to_cam_coord: True
  use_ldr: False

training:
  data_dir: "data_generation/datasets/ds1_single_obj_ball_cbox3"
  log_dir: "training/logs/ds1_single_obj_ball_cbox3"
  run_name: "full_ds"
  # max_dataset_size: 10     # If none, will use entire dataset
  resolution: 128
  batch_size: 10           # process all cached scenes in one forward pass
  # val_batch_size: 10       # batch size for validation dataloader. If not defined, will default to same as batch_size
  epochs: 10000
  warmup_epochs: 1000
  lr: 1e-4
  device: "cuda"
  num_workers: 0           # workers for initial cache-fill DataLoader
  use_amp: True            # bf16 autocast on model forward; losses run in fp32
  use_compile: False       # torch.compile — big speedup but slow first-epoch warm-up
  log_viz_interval: 100    # epochs between validation + image logging
  checkpoint_interval: 1000